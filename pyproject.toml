[project]
name = "recruiter-assistant"
version = "0.1.0"
description = "NLP recruiter assistant: requirement collection, CV search & ranking, grounded outreach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.4.0",
    "openai>=3.41.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recruiter"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
